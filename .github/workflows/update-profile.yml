name: Update Profile SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-svgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create profile directory if not exists
        run: mkdir -p profile

      - name: Download GitHub Stats SVG
        run: |
          curl -s -A "GitHubActions/1.0" -o profile/stats.svg "https://github-readme-stats.vercel.app/api?username=ChermodAldo&theme=dark&show_icons=true&hide_border=true&bg_color=0D1117"

      - name: Download Top Languages SVG
        run: |
          curl -s -A "GitHubActions/1.0" -o profile/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=ChermodAldo&layout=compact&theme=dark&hide_border=true&bg_color=0D1117"

      - name: Download GitHub Trophies SVG
        run: |
          curl -s -A "GitHubActions/1.0" -o profile/trophy.svg "https://github-profile-trophy.vercel.app/?username=ChermodAldo&theme=dracula&no-bg=true&no-frame=true&margin-w=15"

      - name: Commit and Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile SVGs [skip ci]"
          file_pattern: profile/*.svg
